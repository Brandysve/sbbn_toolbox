[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sbbn-toolbox"
version = "0.0.0"
description = "Boîte à outils PDF locale et portable de SBBN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "PyMuPDF>=1.25,<2",
    "pypdf>=5,<7",
    "img2pdf>=0.5,<1",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
sbbn-toolbox = "sbbn_toolbox.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbbn_toolbox"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "fitz", "img2pdf"]
ignore_missing_imports = true
